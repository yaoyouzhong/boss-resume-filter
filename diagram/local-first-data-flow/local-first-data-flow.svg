<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">BOSS 简历筛选器本地优先数据流</title>
  <desc id="desc">候选人和简历进入本机后，先完成解析、规则评分、人工复核与联系；只有在用户主动开启时才向第三方 AI 发送界面声明的范围。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <linearGradient id="local-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c4a6e" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#064e3b" stop-opacity="0.20"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.48"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#34d399"/>
    </marker>
    <marker id="arrow-amber" markerWidth="11" markerHeight="8" refX="10" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#fbbf24"/>
    </marker>
    <style>
      text { font-family: 'Cascadia Code', 'Microsoft YaHei', 'Noto Sans SC', sans-serif; }
      .region-title { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
      .box-title { fill: #f8fafc; font-size: 19px; font-weight: 700; }
      .box-sub { fill: #94a3b8; font-size: 14px; font-weight: 400; }
      .note { fill: #cbd5e1; font-size: 13px; }
      .arrow-label { fill: #94a3b8; font-size: 12px; font-weight: 600; }
    </style>
  </defs>

  <rect width="1440" height="760" fill="#0f172a"/>
  <rect width="1440" height="760" fill="url(#grid)"/>
  <circle cx="1330" cy="80" r="230" fill="#1d4ed8" opacity="0.08"/>
  <circle cx="1220" cy="740" r="300" fill="#059669" opacity="0.06"/>

  <text x="54" y="58" fill="#f8fafc" font-size="28" font-weight="700">BOSS 简历筛选器 · 本地优先数据流</text>
  <text x="54" y="88" fill="#94a3b8" font-size="15">默认在本机完成招聘处理；外部 AI 是可选增强，不是必经路径</text>

  <!-- Region boundaries -->
  <rect x="44" y="132" width="250" height="492" rx="18" fill="#111827" fill-opacity="0.80" stroke="#64748b" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text x="64" y="162" fill="#94a3b8" class="region-title">数据来源</text>

  <rect x="328" y="112" width="760" height="552" rx="22" fill="url(#local-glow)" stroke="#22d3ee" stroke-width="2" stroke-dasharray="12 6"/>
  <text x="350" y="144" fill="#67e8f9" class="region-title">本机边界 · 默认处理路径</text>
  <rect x="927" y="126" width="136" height="30" rx="15" fill="#083344" stroke="#22d3ee"/>
  <text x="995" y="146" fill="#67e8f9" font-size="12" font-weight="700" text-anchor="middle">LOCAL FIRST</text>

  <rect x="1122" y="132" width="274" height="492" rx="18" fill="#111827" fill-opacity="0.82" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text x="1144" y="162" fill="#fbbf24" class="region-title">外部服务 · 可选</text>

  <!-- Connectors behind components -->
  <path d="M 264 247 L 372 247" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 264 423 L 324 423 L 324 300 L 372 300" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 632 270 L 674 270" fill="none" stroke="#22d3ee" stroke-width="3" marker-end="url(#arrow-cyan)"/>
  <path d="M 934 270 L 975 270 L 975 383 L 930 383" fill="none" stroke="#34d399" stroke-width="3" marker-end="url(#arrow-emerald)"/>
  <path d="M 804 438 L 804 492" fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 502 492 L 502 438" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M 592 438 L 710 492" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>

  <!-- Optional AI round trip -->
  <path d="M 934 235 L 1084 235 L 1084 267 L 1154 267" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="9 6" marker-end="url(#arrow-amber)"/>
  <path d="M 1154 330 L 1092 330 L 1092 303 L 934 303" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-amber)" opacity="0.78"/>
  <rect x="976" y="190" width="170" height="26" rx="13" fill="#0f172a"/>
  <text x="1061" y="208" fill="#fbbf24" class="arrow-label" text-anchor="middle">仅在用户开启后</text>

  <!-- Source boxes -->
  <g filter="url(#shadow)">
    <rect x="72" y="202" width="192" height="92" rx="12" fill="#0f172a"/>
    <rect x="72" y="202" width="192" height="92" rx="12" fill="#1e293b" fill-opacity="0.82" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="103" cy="234" r="13" fill="#334155" stroke="#94a3b8"/>
    <path d="M 96 244 Q 103 251 110 244" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <text x="168" y="238" class="box-title" text-anchor="middle">BOSS 候选人</text>
    <text x="168" y="264" class="box-sub" text-anchor="middle">浏览器登录后获取</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="72" y="378" width="192" height="92" rx="12" fill="#0f172a"/>
    <rect x="72" y="378" width="192" height="92" rx="12" fill="#1e293b" fill-opacity="0.82" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 92 402 H 116 V 438 H 92 Z M 98 410 H 110 M 98 418 H 110 M 98 426 H 107" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <text x="177" y="414" class="box-title" text-anchor="middle">外部简历 / 证书</text>
    <text x="177" y="440" class="box-sub" text-anchor="middle">本地文件导入</text>
  </g>

  <!-- Local processing boxes -->
  <g filter="url(#shadow)">
    <rect x="372" y="220" width="260" height="100" rx="14" fill="#0f172a"/>
    <rect x="372" y="220" width="260" height="100" rx="14" fill="#083344" fill-opacity="0.62" stroke="#22d3ee" stroke-width="2"/>
    <text x="502" y="258" class="box-title" text-anchor="middle">获取与结构化解析</text>
    <text x="502" y="286" class="box-sub" text-anchor="middle">简历、岗位、证书字段</text>
    <text x="502" y="306" fill="#67e8f9" font-size="12" text-anchor="middle">在本机执行</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="674" y="220" width="260" height="100" rx="14" fill="#0f172a"/>
    <rect x="674" y="220" width="260" height="100" rx="14" fill="#064e3b" fill-opacity="0.58" stroke="#34d399" stroke-width="2"/>
    <text x="804" y="258" class="box-title" text-anchor="middle">规则筛选与可解释评分</text>
    <text x="804" y="286" class="box-sub" text-anchor="middle">硬条件、技能权重、证据拆解</text>
    <text x="804" y="306" fill="#6ee7b7" font-size="12" text-anchor="middle">AI 不覆盖明确硬条件</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="674" y="352" width="260" height="86" rx="14" fill="#0f172a"/>
    <rect x="674" y="352" width="260" height="86" rx="14" fill="#1d4ed8" fill-opacity="0.22" stroke="#60a5fa" stroke-width="2"/>
    <text x="804" y="386" class="box-title" text-anchor="middle">人工复核与联系确认</text>
    <text x="804" y="414" class="box-sub" text-anchor="middle">证据不足、发送结果不明时停下</text>
  </g>

  <!-- Local data stores -->
  <g filter="url(#shadow)">
    <rect x="382" y="492" width="240" height="90" fill="#0f172a"/>
    <ellipse cx="502" cy="492" rx="120" ry="17" fill="#0f172a"/>
    <ellipse cx="502" cy="582" rx="120" ry="17" fill="#0f172a"/>
    <rect x="382" y="492" width="240" height="90" fill="#4c1d95" fill-opacity="0.45"/>
    <ellipse cx="502" cy="492" rx="120" ry="17" fill="#4c1d95" fill-opacity="0.62" stroke="#a78bfa" stroke-width="2"/>
    <ellipse cx="502" cy="582" rx="120" ry="17" fill="#4c1d95" fill-opacity="0.62" stroke="#a78bfa" stroke-width="2"/>
    <line x1="382" y1="492" x2="382" y2="582" stroke="#a78bfa" stroke-width="2"/>
    <line x1="622" y1="492" x2="622" y2="582" stroke="#a78bfa" stroke-width="2"/>
    <text x="502" y="535" class="box-title" text-anchor="middle">本地候选人数据</text>
    <text x="502" y="560" class="box-sub" text-anchor="middle">简历、状态、反馈与跟进</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="682" y="492" width="244" height="90" rx="14" fill="#0f172a"/>
    <rect x="682" y="492" width="244" height="90" rx="14" fill="#4c1d95" fill-opacity="0.34" stroke="#a78bfa" stroke-width="1.7"/>
    <text x="804" y="526" class="box-title" text-anchor="middle">系统安全凭据</text>
    <text x="804" y="552" class="box-sub" text-anchor="middle">DPAPI / macOS Keychain</text>
    <text x="804" y="574" fill="#c4b5fd" font-size="12" text-anchor="middle">API Key 不写入候选人文件</text>
  </g>

  <!-- Optional external AI -->
  <g filter="url(#shadow)">
    <rect x="1154" y="218" width="210" height="126" rx="14" fill="#0f172a"/>
    <rect x="1154" y="218" width="210" height="126" rx="14" fill="#78350f" fill-opacity="0.38" stroke="#fbbf24" stroke-width="2"/>
    <text x="1259" y="256" class="box-title" text-anchor="middle">第三方 AI 服务</text>
    <text x="1259" y="284" class="box-sub" text-anchor="middle">岗位解析、画像、评估、识别</text>
    <rect x="1182" y="303" width="154" height="24" rx="12" fill="#451a03" stroke="#f59e0b"/>
    <text x="1259" y="320" fill="#fcd34d" font-size="11" font-weight="700" text-anchor="middle">界面声明发送范围</text>
  </g>

  <g>
    <rect x="1154" y="394" width="210" height="112" rx="14" fill="#0f172a"/>
    <rect x="1154" y="394" width="210" height="112" rx="14" fill="#881337" fill-opacity="0.30" stroke="#fb7185" stroke-width="1.6"/>
    <text x="1259" y="428" fill="#fecdd3" font-size="16" font-weight="700" text-anchor="middle">不自动发送</text>
    <text x="1259" y="456" class="box-sub" text-anchor="middle">整库候选人数据</text>
    <text x="1259" y="480" class="box-sub" text-anchor="middle">本地备份 / Chrome 登录状态</text>
  </g>

  <!-- Bottom notes and legend -->
  <rect x="44" y="688" width="1352" height="44" rx="12" fill="#111827" stroke="#334155"/>
  <circle cx="72" cy="710" r="6" fill="#22d3ee"/>
  <text x="88" y="715" class="note">实线：默认本地处理</text>
  <line x1="270" y1="710" x2="320" y2="710" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="334" y="715" class="note">虚线：用户主动开启的可选 AI 路径</text>
  <rect x="722" y="697" width="14" height="14" rx="3" fill="#4c1d95" stroke="#a78bfa"/>
  <text x="748" y="715" class="note">数据和凭据分开保管</text>
  <text x="1368" y="715" fill="#64748b" font-size="11" text-anchor="end">备份 ZIP 当前不加密，应保存在受控目录</text>
</svg>
