name: Bug Report
description: 报告可重复的程序故障
title: "[Bug] "
body:
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已使用最新公开版本，并搜索过现有 Issue。
          required: true
        - label: 我不会上传真实候选人数据、简历、API Key、Cookie 或其他敏感信息。
          required: true
        - label: 这不是需要私密披露的安全漏洞。
          required: true
  - type: input
    attributes:
      label: 程序版本
      description: 例如 v2.31。
      placeholder: v2.31
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS
        - 其他
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 问题区域
      options:
        - 启动与更新
        - Chrome 连接与 BOSS 页面
        - 岗位配置与筛选
        - 外部简历导入
        - AI 模型与 API
        - 候选人复核、联系与跟进
        - 学历核验
        - 数据、备份与导出
        - 其他
    validations:
      required: true
  - type: textarea
    attributes:
      label: 问题描述
      description: 说明实际发生了什么，以及对使用的影响。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 重现步骤
      description: 请提供稳定重现问题的最小步骤。
      placeholder: |
        1. 进入……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    attributes:
      label: 脱敏证据
      description: 可附加已脱敏的截图、日志或诊断包；没有可留空。
  - type: textarea
    attributes:
      label: 补充信息
      description: 包括是否稳定复现、已尝试的解决方法等。
