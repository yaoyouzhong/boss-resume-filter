name: Feature Request
description: 提出明确的使用场景和产品改进建议
title: "[Feature] "
body:
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue 和更新记录，没有找到相同建议。
          required: true
        - label: 我不会上传真实候选人数据、简历、API Key 或其他敏感信息。
          required: true
  - type: textarea
    attributes:
      label: 使用场景
      description: 说明在什么招聘流程中遇到了什么问题。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 希望达成的结果
      description: 描述用户最终应该能够完成什么，无需规定实现方案。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 当前替代方式
      description: 如果目前有临时做法，请说明其步骤和不足；没有可留空。
  - type: dropdown
    attributes:
      label: 影响范围
      options:
        - 单个候选人操作
        - 单个岗位流程
        - 批量候选人处理
        - 数据与备份
        - 模型与外部服务
        - 其他
    validations:
      required: true
  - type: textarea
    attributes:
      label: 验收标准
      description: 说明如何判断这项改进已经真正解决问题。
    validations:
      required: true
