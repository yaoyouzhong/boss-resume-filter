name: PR Checks

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Stable regression (Windows, Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile tracked source files
        run: python -c "import build; build._check_source_compiles()"

      - name: Run stable regression
        run: python tests/run_unit_tests.py

      - name: Run import smoke test
        run: python tests/test_import.py
