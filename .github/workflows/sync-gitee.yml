name: Sync to Gitee

on:
  push:
    branches: [master]

concurrency:
  group: sync-gitee
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Gitee
        run: |
          git remote add gitee https://yaoyouzhong:${{ secrets.GITEE_TOKEN }}@gitee.com/yaoyouzhong/boss-resume-filter.git || true
          git push gitee master:master || {
            echo "Push failed. Retrying once in 5s; non-fast-forward divergence will not be overwritten."
            sleep 5
            git push gitee master:master
          }
